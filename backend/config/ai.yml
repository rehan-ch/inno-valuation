    temperature: 0.3
  bridge_gaps:
    model: claude-sonnet-5-5
    max_tokens: 3000
    temperature: 0.4
  recommendations:
    model: claude-sonnet-5-5
    max_tokens: 4000
    temperature: 0.4
  report_narrative:
    model: claude-opus-5-5
    max_tokens: 8000
    temperature: 0.4
  consultation_nudge:
    model: claude-sonnet-5-5
