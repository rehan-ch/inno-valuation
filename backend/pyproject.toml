[project]
name = "innovaluation-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=2",
    "argon2-cffi>=25.1.0",
    "celery[redis]>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.142.2",
    "jinja2>=3.1.6",
    "psycopg[binary]>=3",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pyyaml>=6.0.3",
    "redis>=6.4.0",
    "resend>=2.49.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "factory-boy>=3.3.3",
    "httpx2>=2.16.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Beyond style: security (S), timezone-safe datetimes (DTZ), bug patterns (B, PL, PERF,
# ASYNC), pytest style (PT), no stray prints (T20) or commented-out code (ERA).
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF", "C4", "PT", "PERF", "ASYNC",
    "N", "DTZ", "T20", "PIE", "RET", "ERA", "PL", "TRY",
]
ignore = [
    "TRY003",  # AppError(code, message) is the house style for errors.
    "PLR0913", # FastAPI endpoints take many injected dependencies.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # pytest uses assert.
    "PLR2004", # HTTP status codes and expected values read best inline.
    "S105",    # test fixtures use fake passwords and tokens.
    "S106",
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "app.core.deps.require_permission",
    "app.core.deps.require_role",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["factory.*"]
ignore_missing_imports = true
