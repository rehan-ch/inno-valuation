# Local development services. Run with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: innovaluation
      POSTGRES_PASSWORD: innovaluation
      POSTGRES_DB: innovaluation
    ports:
      - "5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovaluation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
