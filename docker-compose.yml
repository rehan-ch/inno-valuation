# Local development services. Run with: docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: innovaluation
      POSTGRES_PASSWORD: innovaluation
      POSTGRES_DB: innovaluation
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innovaluation"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6390:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local mail catcher: development emails are delivered here instead of being sent.
  # Web UI on http://localhost:8025, SMTP on localhost:1026.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1026:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
