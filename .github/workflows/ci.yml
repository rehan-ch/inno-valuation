name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: innovaluation
          POSTGRES_PASSWORD: innovaluation
          POSTGRES_DB: innovaluation
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U innovaluation"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://innovaluation:innovaluation@localhost:5440/innovaluation
      TEST_DATABASE_URL: postgresql+psycopg://innovaluation:innovaluation@localhost:5440/postgres
      REDIS_URL: redis://localhost:6390/0
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: ../bin/test-scoring
      - run: uv run pytest --ignore=tests/scoring
      - run: uv run alembic upgrade head && uv run alembic check
      - name: Dependency vulnerability audit
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt
          uvx pip-audit --disable-pip --require-hashes --strict -r /tmp/req.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
